<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aihireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="aihireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="aihireGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aihireBg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800"/>
    <path d="M60 0 V500 M120 0 V500 M180 0 V500 M240 0 V500 M300 0 V500 M360 0 V500 M420 0 V500 M480 0 V500 M540 0 V500 M600 0 V500 M660 0 V500 M720 0 V500"/>
  </g>

  <!-- Left Side: AI Interview Candidate Assessment Window -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="340" height="380" rx="16" fill="#131d38" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="340" height="42" rx="16" fill="#1a2544"/>
    <circle cx="25" cy="21" r="6" fill="#ef4444"/>
    <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="21" r="6" fill="#10b981"/>
    <text x="95" y="26" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="700">AIHire • Live Candidate Assessment</text>

    <!-- Candidate Face Mesh / Audio Wave -->
    <rect x="25" y="60" width="290" height="150" rx="12" fill="#0c1326" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Face Silhouette / Mesh Nodes -->
    <circle cx="170" cy="115" r="40" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="155" cy="105" r="5" fill="#38bdf8"/>
    <circle cx="185" cy="105" r="5" fill="#38bdf8"/>
    <path d="M158 135 Q170 145 182 135" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Real-time Speech Waveform -->
    <path d="M40 185 Q70 160 100 185 T160 185 T220 160 T280 185" fill="none" stroke="url(#aihireGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="170" y="198" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SPEECH &amp; INTENT STREAMING: ACTIVE</text>

    <!-- Evaluation Scores -->
    <rect x="25" y="225" width="135" height="60" rx="8" fill="#1a2748"/>
    <text x="35" y="246" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="700">TECHNICAL ACCURACY</text>
    <text x="35" y="272" fill="#38bdf8" font-family="system-ui" font-size="20" font-weight="900">94.8%</text>

    <rect x="180" y="225" width="135" height="60" rx="8" fill="#1a2748"/>
    <text x="190" y="246" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="700">CONFIDENCE &amp; TONE</text>
    <text x="190" y="272" fill="#10b981" font-family="system-ui" font-size="20" font-weight="900">92.0%</text>

    <!-- Resume Match Pill -->
    <rect x="25" y="300" width="290" height="48" rx="8" fill="#1e223d" stroke="#a855f7" stroke-width="1"/>
    <text x="40" y="322" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="800">AUTOMATED RESUME SCREENER</text>
    <text x="40" y="338" fill="#e2e8f0" font-family="system-ui" font-size="11">Job Description Fit: 96% Match</text>
  </g>

  <!-- Right Side: LLM Interview Engine & Decision Flow -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="310" height="95" rx="14" fill="#16203c" stroke="url(#aihireGrad)" stroke-width="1.5" filter="url(#aihireGlow)"/>
    <text x="25" y="32" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="800">B.TECH CAPSTONE PROJECT</text>
    <text x="25" y="58" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="900">AIHire Platform</text>
    <text x="25" y="80" fill="#94a3b8" font-family="system-ui" font-size="12">Autonomous AI Interview System</text>

    <rect x="0" y="120" width="310" height="100" rx="14" fill="#16203c" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="150" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="800">LLM EVALUATION ENGINE</text>
    <text x="25" y="174" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="800">Adaptive Question Generation</text>
    <text x="25" y="196" fill="#94a3b8" font-family="system-ui" font-size="11">Dynamically assesses candidate coding &amp; behavioral responses</text>

    <rect x="0" y="245" width="310" height="95" rx="14" fill="#16203c" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="275" fill="#34d399" font-family="system-ui" font-size="11" font-weight="800">STACK &amp; DEPLOYMENT</text>
    <text x="25" y="300" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="800">Next.js + FastAPI + Docker + LLMs</text>
    <text x="25" y="322" fill="#94a3b8" font-family="system-ui" font-size="11">Real-time candidate scorecard export</text>
  </g>
</svg>
