<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="epassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="epassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#epassBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800"/>
    <path d="M60 0 V500 M120 0 V500 M180 0 V500 M240 0 V500 M300 0 V500 M360 0 V500 M420 0 V500 M480 0 V500 M540 0 V500 M600 0 V500 M660 0 V500 M720 0 V500"/>
  </g>

  <!-- Left: Security Gate Pass Card -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="310" height="400" rx="20" fill="#131d35" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
    
    <!-- Top Pass Header -->
    <rect x="0" y="0" width="310" height="56" rx="20" fill="#1e2d4d"/>
    <text x="24" y="34" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="900">CT E-PASS DIGITAL GATE</text>
    <rect x="225" y="18" width="65" height="20" rx="10" fill="#10b981"/>
    <text x="257" y="32" fill="#064e3b" font-family="system-ui" font-size="9" font-weight="900" text-anchor="middle">ACTIVE</text>

    <!-- Student Pass Details -->
    <rect x="20" y="72" width="270" height="90" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="55" cy="117" r="24" fill="#3b82f6"/>
    <text x="55" y="123" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="900" text-anchor="middle">SK</text>

    <text x="92" y="102" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="800">Suman Krishna</text>
    <text x="92" y="118" fill="#94a3b8" font-family="monospace" font-size="10">Roll: 2301275 • CSE</text>
    <text x="92" y="134" fill="#10b981" font-family="system-ui" font-size="10" font-weight="700">Campus Exit Granted</text>

    <!-- Dynamic Cryptographic QR Code -->
    <rect x="20" y="174" width="270" height="150" rx="12" fill="#ffffff"/>
    <g transform="translate(85, 184)">
      <!-- Large QR representation -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
      <rect x="5" y="5" width="28" height="28" fill="#0f172a"/>
      <rect x="10" y="10" width="18" height="18" fill="#ffffff"/>
      <rect x="67" y="5" width="28" height="28" fill="#0f172a"/>
      <rect x="72" y="10" width="18" height="18" fill="#ffffff"/>
      <rect x="5" y="67" width="28" height="28" fill="#0f172a"/>
      <rect x="10" y="72" width="18" height="18" fill="#ffffff"/>
      <rect x="42" y="42" width="16" height="16" fill="#10b981"/>
      <rect x="40" y="15" width="10" height="18" fill="#0f172a"/>
      <rect x="75" y="45" width="20" height="15" fill="#0f172a"/>
      <rect x="40" y="70" width="20" height="18" fill="#0f172a"/>
      <rect x="70" y="70" width="25" height="25" fill="#0f172a"/>
    </g>
    <text x="155" y="305" fill="#0f172a" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">HASH: SHA256-CT98X124B</text>
    <text x="155" y="318" fill="#059669" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">EXPIRY: 18:45:00 (TIME-BOUND)</text>

    <!-- Checkpoint confirmation -->
    <rect x="20" y="336" width="270" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="155" y="358" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">GUARD CHECKPOINT SCAN PASSED</text>
    <text x="155" y="373" fill="#6ee7b7" font-family="monospace" font-size="9" text-anchor="middle">TIMESTAMP: 2026-11-11 16:22:10 IST</text>
  </g>

  <!-- Right: Guard Console & Access Logs -->
  <g transform="translate(400, 50)">
    <rect x="0" y="0" width="340" height="400" rx="16" fill="#131d35" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>

    <!-- Console Header -->
    <rect x="0" y="0" width="340" height="40" rx="16" fill="#1e293b"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700">Main Campus Gate Security Station #01</text>

    <!-- Metrics -->
    <rect x="20" y="55" width="140" height="65" rx="8" fill="#1a2542"/>
    <text x="30" y="74" fill="#94a3b8" font-family="system-ui" font-size="9" font-weight="700">VALIDATION SPEED</text>
    <text x="30" y="102" fill="#10b981" font-family="monospace" font-size="20" font-weight="900">&lt; 1.2s</text>

    <rect x="180" y="55" width="140" height="65" rx="8" fill="#1a2542"/>
    <text x="190" y="74" fill="#94a3b8" font-family="system-ui" font-size="9" font-weight="700">FORGERY RATE</text>
    <text x="190" y="102" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="900">0.00%</text>

    <!-- Access Stream -->
    <rect x="20" y="132" width="300" height="180" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
    <text x="32" y="152" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="800">Live Campus Gate Telemetry</text>

    <g transform="translate(32, 168)">
      <circle cx="4" cy="6" r="3" fill="#10b981"/>
      <text x="14" y="9" fill="#cbd5e1" font-family="monospace" font-size="9">ENTRY: Staff #T804 — Gate 1</text>
      <text x="210" y="9" fill="#64748b" font-family="monospace" font-size="8">16:22:04</text>

      <circle cx="4" cy="28" r="3" fill="#10b981"/>
      <text x="14" y="31" fill="#cbd5e1" font-family="monospace" font-size="9">EXIT: Stu 2301275 (Suman) — Gate 1</text>
      <text x="210" y="31" fill="#64748b" font-family="monospace" font-size="8">16:22:10</text>

      <circle cx="4" cy="50" r="3" fill="#38bdf8"/>
      <text x="14" y="53" fill="#cbd5e1" font-family="monospace" font-size="9">VISITOR: Parent OTP Verified</text>
      <text x="210" y="53" fill="#64748b" font-family="monospace" font-size="8">16:21:45</text>

      <circle cx="4" cy="72" r="3" fill="#ef4444"/>
      <text x="14" y="75" fill="#fca5a5" font-family="monospace" font-size="9">BLOCK: Expired Token Rejected</text>
      <text x="210" y="75" fill="#64748b" font-family="monospace" font-size="8">16:19:22</text>

      <circle cx="4" cy="94" r="3" fill="#10b981"/>
      <text x="14" y="97" fill="#cbd5e1" font-family="monospace" font-size="9">SMS: Guardian Exit Alert Dispatched</text>
      <text x="210" y="97" fill="#64748b" font-family="monospace" font-size="8">16:22:11</text>
    </g>

    <!-- Tech Stack Pill Row -->
    <rect x="20" y="325" width="300" height="55" rx="8" fill="#1a2542"/>
    <text x="32" y="343" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="700">CORE SECURITY INFRASTRUCTURE</text>
    <g transform="translate(32, 350)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#0284c7"/>
      <text x="30" y="14" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Flutter</text>
      
      <rect x="68" y="0" width="70" height="20" rx="4" fill="#059669"/>
      <text x="103" y="14" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">QR Crypto</text>

      <rect x="146" y="0" width="60" height="20" rx="4" fill="#ea580c"/>
      <text x="176" y="14" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Firebase</text>

      <rect x="214" y="0" width="55" height="20" rx="4" fill="#7c3aed"/>
      <text x="241" y="14" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">RBAC</text>
    </g>
  </g>
</svg>
