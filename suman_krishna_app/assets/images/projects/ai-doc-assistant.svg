<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ragBg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800"/>
    <path d="M60 0 V500 M120 0 V500 M180 0 V500 M240 0 V500 M300 0 V500 M360 0 V500 M420 0 V500 M480 0 V500 M540 0 V500 M600 0 V500 M660 0 V500 M720 0 V500"/>
  </g>

  <!-- Left: RAG Pipeline Schematic Flow -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="320" height="400" rx="16" fill="#131d38" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="320" height="40" rx="16" fill="#1a2544"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700">RAG Semantic Indexing Pipeline</text>

    <!-- Node 1: Multi-Doc Ingestion -->
    <rect x="20" y="60" width="280" height="60" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="35" y="82" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="800">1. DOCUMENT INGESTION</text>
    <text x="35" y="102" fill="#94a3b8" font-family="system-ui" font-size="10">PDFs • DOCX • Manuals • Spec Sheets</text>

    <!-- Arrow Down -->
    <line x1="160" y1="120" x2="160" y2="140" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="156,138 164,138 160,144" fill="#818cf8"/>

    <!-- Node 2: Chunking & Embeddings -->
    <rect x="20" y="145" width="280" height="60" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="35" y="167" fill="#818cf8" font-family="monospace" font-size="11" font-weight="800">2. CHUNKING &amp; EMBEDDINGS</text>
    <text x="35" y="187" fill="#94a3b8" font-family="system-ui" font-size="10">Recursive 512-Token • Sentence-Transformers</text>

    <!-- Arrow Down -->
    <line x1="160" y1="205" x2="160" y2="225" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="156,223 164,223 160,229" fill="#a855f7"/>

    <!-- Node 3: FAISS Vector Store -->
    <rect x="20" y="230" width="280" height="60" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="35" y="252" fill="#c084fc" font-family="monospace" font-size="11" font-weight="800">3. FAISS VECTOR INDEX</text>
    <text x="35" y="272" fill="#94a3b8" font-family="system-ui" font-size="10">High-Dim Dense Vector Similarity Search</text>

    <!-- Arrow Down -->
    <line x1="160" y1="290" x2="160" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="156,308 164,308 160,314" fill="#10b981"/>

    <!-- Node 4: Gemini LLM Synthesis -->
    <rect x="20" y="315" width="280" height="65" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="337" fill="#34d399" font-family="monospace" font-size="11" font-weight="800">4. GROUNDED LLM SYNTHESIS</text>
    <text x="35" y="357" fill="#94a3b8" font-family="system-ui" font-size="10">Gemini 1.5 Pro • Strict Page Citations</text>
  </g>

  <!-- Right: Interactive Q&A Chat UI -->
  <g transform="translate(410, 50)">
    <rect x="0" y="0" width="330" height="400" rx="16" fill="#131d38" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>

    <!-- Chat Header -->
    <rect x="0" y="0" width="330" height="40" rx="16" fill="#1e223d"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700">AI Document Assistant • Live Chat</text>

    <!-- User Query Bubble -->
    <g transform="translate(20, 55)">
      <rect x="40" y="0" width="250" height="44" rx="10" fill="#3b82f6"/>
      <text x="52" y="20" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="600">What is the fail-safe protocol</text>
      <text x="52" y="34" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="600">for Section 4.2 in the manual?</text>
    </g>

    <!-- AI Grounded Response Bubble -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="290" height="150" rx="10" fill="#0f172a" stroke="rgba(56,189,248,0.25)"/>
      <text x="14" y="22" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="800">SOURCE: system_architecture.pdf (pg. 42)</text>
      <text x="14" y="44" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="500">"Under Section 4.2, when heartbeat</text>
      <text x="14" y="60" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="500">fails beyond 350ms, the system triggers</text>
      <text x="14" y="76" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="500">Level-1 failover to redundant buffer."</text>
      
      <!-- Citation Chips -->
      <rect x="14" y="96" width="110" height="20" rx="4" fill="#1e293b"/>
      <text x="22" y="110" fill="#10b981" font-family="monospace" font-size="9">✓ Grounded: 99.4%</text>

      <rect x="135" y="96" width="115" height="20" rx="4" fill="#1e293b"/>
      <text x="143" y="110" fill="#818cf8" font-family="monospace" font-size="9">Latency: 280ms</text>
      
      <text x="14" y="136" fill="#64748b" font-family="system-ui" font-size="9">Hallucination Risk: None (Strict RAG Bound)</text>
    </g>

    <!-- Metric Boxes -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#1a243c"/>
      <text x="12" y="18" fill="#94a3b8" font-family="system-ui" font-size="9" font-weight="700">RETRIEVAL RECALL</text>
      <text x="12" y="38" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="900">96.8% BM25+V</text>

      <rect x="150" y="0" width="140" height="50" rx="8" fill="#1a243c"/>
      <text x="162" y="18" fill="#94a3b8" font-family="system-ui" font-size="9" font-weight="700">INDEXED CORPUS</text>
      <text x="162" y="38" fill="#10b981" font-family="monospace" font-size="16" font-weight="900">Multi-Format</text>
    </g>

    <!-- Architecture Pill Row -->
    <g transform="translate(20, 344)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#0284c7"/>
      <text x="30" y="15" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">FAISS</text>

      <rect x="68" y="0" width="75" height="22" rx="4" fill="#4f46e5"/>
      <text x="105" y="15" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">LangChain</text>

      <rect x="150" y="0" width="70" height="22" rx="4" fill="#7c3aed"/>
      <text x="185" y="15" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Gemini Pro</text>

      <rect x="228" y="0" width="62" height="22" rx="4" fill="#059669"/>
      <text x="259" y="15" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">Streamlit</text>
    </g>
  </g>
</svg>
