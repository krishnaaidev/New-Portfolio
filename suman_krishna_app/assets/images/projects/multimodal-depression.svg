<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  
  <!-- Grid Background -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800"/>
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow1)"/>
  <circle cx="600" cy="320" r="150" fill="#38bdf8" opacity="0.15" filter="url(#glow1)"/>

  <!-- Tri-Modal Streams Card -->
  <!-- Stream 1: Text / BERT -->
  <rect x="70" y="80" width="200" height="110" rx="14" fill="#131b2e" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
  <text x="90" y="112" fill="#818cf8" font-family="system-ui" font-size="13" font-weight="700">TEXT STREAM</text>
  <text x="90" y="132" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">BERT Transformer</text>
  <rect x="90" y="152" width="130" height="6" rx="3" fill="#6366f1" opacity="0.5"/>
  <rect x="90" y="166" width="90" height="6" rx="3" fill="#6366f1" opacity="0.3"/>

  <!-- Stream 2: Audio / Wav2Vec2 -->
  <rect x="70" y="210" width="200" height="110" rx="14" fill="#131b2e" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <text x="90" y="242" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700">AUDIO STREAM</text>
  <text x="90" y="262" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">Wav2Vec 2.0</text>
  <path d="M90 295 Q105 270 120 295 T150 295 T180 270 T210 295 T240 280" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stream 3: Video / ResNet-LSTM -->
  <rect x="70" y="340" width="200" height="110" rx="14" fill="#131b2e" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
  <text x="90" y="372" fill="#c084fc" font-family="system-ui" font-size="13" font-weight="700">FACIAL / VIDEO</text>
  <text x="90" y="392" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">ResNet-LSTM</text>
  <circle cx="110" cy="422" r="10" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="150" cy="422" r="10" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="190" cy="422" r="10" fill="none" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Fusion Lines connecting to central node -->
  <path d="M270 135 C350 135 370 260 440 260" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M270 265 L440 265" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M270 395 C350 395 370 270 440 270" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Central Late-Fusion Node -->
  <circle cx="510" cy="265" r="70" fill="#1e293b" stroke="url(#neonPulse)" stroke-width="3" filter="url(#glow1)"/>
  <text x="510" y="255" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="800" text-anchor="middle">LATE FUSION</text>
  <text x="510" y="275" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Multi-Head Attn</text>
  <text x="510" y="293" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">DAIC-WOZ</text>

  <!-- Output Decision Box -->
  <path d="M580 265 L640 265" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="640" y="205" width="130" height="120" rx="14" fill="#0f2922" stroke="#10b981" stroke-width="2"/>
  <text x="705" y="240" fill="#6ee7b7" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">CLINICAL</text>
  <text x="705" y="265" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="900" text-anchor="middle">Depression</text>
  <text x="705" y="288" fill="#34d399" font-family="system-ui" font-size="15" font-weight="800" text-anchor="middle">Detector</text>
  <text x="705" y="308" fill="#a7f3d0" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">FastAPI + Extension</text>
</svg>
