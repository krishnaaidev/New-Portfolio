<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roboBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#182337"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#roboBg)"/>

  <!-- Circuit lines -->
  <g stroke="#0284c7" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M50 100 H180 L230 150 H350"/>
    <path d="M50 400 H200 L250 350 H400"/>
    <path d="M750 120 H620 L570 170 H480"/>
    <path d="M750 380 H600 L550 330 H450"/>
    <circle cx="180" cy="100" r="4" fill="#38bdf8"/>
    <circle cx="620" cy="120" r="4" fill="#38bdf8"/>
  </g>

  <!-- Robo Car Chassis (Top-down / isometric view) -->
  <g transform="translate(400, 250)">
    <!-- Wheels -->
    <rect x="-140" y="-120" width="40" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="100" y="-120" width="40" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-140" y="50" width="40" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="100" y="50" width="40" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

    <!-- Main Chassis Frame -->
    <rect x="-105" y="-100" width="210" height="200" rx="20" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Arduino Board -->
    <rect x="-65" y="-70" width="130" height="90" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="-45" fill="#ffffff" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">ARDUINO UNO</text>
    <rect x="-55" y="-30" width="25" height="40" rx="4" fill="#334155"/>
    <rect x="-15" y="-35" width="70" height="45" rx="4" fill="#0f172a"/>
    <text x="20" y="-10" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">ATMEGA328P</text>

    <!-- Bluetooth HC-05 Module -->
    <rect x="-55" y="35" width="45" height="50" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="-32" y="52" fill="#bfdbfe" font-family="system-ui" font-size="8" font-weight="800" text-anchor="middle">HC-05</text>
    <circle cx="-32" cy="70" r="4" fill="#3b82f6"/>

    <!-- L298N Motor Driver Module -->
    <rect x="10" y="35" width="55" height="50" rx="4" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
    <text x="37" y="52" fill="#fecaca" font-family="system-ui" font-size="8" font-weight="800" text-anchor="middle">L298N</text>
    <!-- Heat sink -->
    <rect x="18" y="60" width="38" height="18" rx="2" fill="#1e293b"/>

    <!-- Bluetooth Waves -->
    <path d="M-32 20 A 15 15 0 0 1 -17 35" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <path d="M-32 10 A 25 25 0 0 1 -7 35" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Info Badges -->
  <rect x="60" y="50" width="220" height="80" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="80" y="80" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="800">HARDWARE ARCHITECTURE</text>
  <text x="80" y="105" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">Dual Control Robotics</text>

  <rect x="520" y="50" width="220" height="80" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="540" y="80" fill="#34d399" font-family="system-ui" font-size="11" font-weight="800">COMMUNICATION</text>
  <text x="540" y="105" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="800">Bluetooth + Wired Mode</text>
</svg>
