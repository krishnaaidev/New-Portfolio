<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ctEventsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ctEventsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ctEventsBg)"/>

  <!-- Engineering Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800"/>
    <path d="M60 0 V500 M120 0 V500 M180 0 V500 M240 0 V500 M300 0 V500 M360 0 V500 M420 0 V500 M480 0 V500 M540 0 V500 M600 0 V500 M660 0 V500 M720 0 V500"/>
  </g>

  <!-- Left: Mobile App Device Frame -->
  <g transform="translate(60, 50)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="240" height="400" rx="28" fill="#1e293b" stroke="rgba(56,189,248,0.4)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="10" y="10" width="220" height="380" rx="20" fill="#0f172a"/>
    <!-- Notch -->
    <rect x="75" y="14" width="90" height="12" rx="6" fill="#1e293b"/>

    <!-- App Header -->
    <text x="24" y="52" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="800">CT Events</text>
    <circle cx="205" cy="48" r="6" fill="#38bdf8"/>

    <!-- Featured Event Card -->
    <rect x="20" y="66" width="200" height="110" rx="12" fill="url(#ctEventsGrad)"/>
    <text x="32" y="88" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">HACKATHON 2026</text>
    <text x="32" y="108" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="900">National AI Conclave</text>
    <rect x="32" y="122" width="70" height="22" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="42" y="137" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700">REGISTERED</text>

    <!-- Mini Calendar / Categories -->
    <rect x="20" y="188" width="60" height="42" rx="8" fill="#1e293b"/>
    <text x="35" y="206" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="800">14</text>
    <text x="32" y="222" fill="#94a3b8" font-family="system-ui" font-size="8">NOV</text>

    <rect x="90" y="188" width="60" height="42" rx="8" fill="#1e293b"/>
    <text x="105" y="206" fill="#a855f7" font-family="monospace" font-size="11" font-weight="800">20</text>
    <text x="102" y="222" fill="#94a3b8" font-family="system-ui" font-size="8">NOV</text>

    <rect x="160" y="188" width="60" height="42" rx="8" fill="#1e293b"/>
    <text x="175" y="206" fill="#10b981" font-family="monospace" font-size="11" font-weight="800">02</text>
    <text x="172" y="222" fill="#94a3b8" font-family="system-ui" font-size="8">DEC</text>

    <!-- QR Ticket Preview in App -->
    <rect x="20" y="242" width="200" height="135" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="32" y="262" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="700">DIGITAL ENTRY PASS</text>
    <!-- QR Code Mock -->
    <rect x="75" y="275" width="90" height="90" rx="8" fill="#ffffff"/>
    <rect x="85" y="285" width="24" height="24" fill="#0f172a"/>
    <rect x="89" y="289" width="16" height="16" fill="#ffffff"/>
    <rect x="131" y="285" width="24" height="24" fill="#0f172a"/>
    <rect x="135" y="289" width="16" height="16" fill="#ffffff"/>
    <rect x="85" y="331" width="24" height="24" fill="#0f172a"/>
    <rect x="89" y="335" width="16" height="16" fill="#ffffff"/>
    <rect x="115" y="315" width="10" height="10" fill="#0f172a"/>
    <rect x="135" y="325" width="16" height="12" fill="#0f172a"/>
  </g>

  <!-- Right: Admin Architecture & Metric Dashboard -->
  <g transform="translate(340, 50)">
    <!-- Admin Window Frame -->
    <rect x="0" y="0" width="400" height="400" rx="16" fill="#131d35" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="400" height="40" rx="16" fill="#1a2744"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="75" y="24" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700">CT Events • Institutional Admin Dashboard</text>

    <!-- Stat Metric Boxes -->
    <rect x="25" y="60" width="165" height="75" rx="10" fill="#1a243c"/>
    <text x="40" y="82" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="700">ACTIVE STUDENTS</text>
    <text x="40" y="112" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="900">5,000+</text>

    <rect x="210" y="60" width="165" height="75" rx="10" fill="#1a243c"/>
    <text x="225" y="82" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="700">CHECK-IN SPEED</text>
    <text x="225" y="112" fill="#10b981" font-family="monospace" font-size="24" font-weight="900">&lt; 1.0s</text>

    <!-- Real-time Event Feed -->
    <rect x="25" y="150" width="350" height="140" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <text x="40" y="174" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="800">Live Registration Stream (Firestore Sync)</text>
    
    <g transform="translate(40, 190)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="18" y="10" fill="#cbd5e1" font-family="monospace" font-size="10">2301275 registered for HackAI 2026</text>
      <text x="270" y="10" fill="#64748b" font-family="monospace" font-size="9">just now</text>

      <circle cx="6" cy="28" r="4" fill="#38bdf8"/>
      <text x="18" y="32" fill="#cbd5e1" font-family="monospace" font-size="10">QR Gate-Pass Verified (Hall A Gate 2)</text>
      <text x="270" y="32" fill="#64748b" font-family="monospace" font-size="9">12s ago</text>

      <circle cx="6" cy="50" r="4" fill="#a855f7"/>
      <text x="18" y="54" fill="#cbd5e1" font-family="monospace" font-size="10">FCM Push Broadcast Sent: 1,420 Devices</text>
      <text x="270" y="54" fill="#64748b" font-family="monospace" font-size="9">1m ago</text>

      <circle cx="6" cy="72" r="4" fill="#f59e0b"/>
      <text x="18" y="76" fill="#cbd5e1" font-family="monospace" font-size="10">Attendance Report Exported: PDF/Excel</text>
      <text x="270" y="76" fill="#64748b" font-family="monospace" font-size="9">4m ago</text>
    </g>

    <!-- Architecture Badges -->
    <rect x="25" y="310" width="350" height="70" rx="10" fill="#1a243c"/>
    <text x="40" y="332" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">TECH STACK ARCHITECTURE</text>
    <g transform="translate(40, 344)">
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#0284c7"/>
      <text x="35" y="16" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Flutter 3</text>

      <rect x="78" y="0" width="60" height="24" rx="6" fill="#ea580c"/>
      <text x="108" y="16" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Firebase</text>

      <rect x="146" y="0" width="65" height="24" rx="6" fill="#4f46e5"/>
      <text x="178" y="16" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Firestore</text>

      <rect x="219" y="0" width="90" height="24" rx="6" fill="#059669"/>
      <text x="264" y="16" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">QR Ticketing</text>
    </g>
  </g>
</svg>
