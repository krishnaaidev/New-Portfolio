<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="careerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1124"/>
      <stop offset="100%" stop-color="#1b1c3d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#careerBg)"/>

  <!-- Radar / Spider Chart on the left -->
  <g transform="translate(230, 250)">
    <!-- Polygons -->
    <polygon points="0,-150 142,-46 88,121 -88,121 -142,-46" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <polygon points="0,-100 95,-31 59,81 -59,81 -95,-31" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <polygon points="0,-50 47,-15 29,40 -29,40 -47,-15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="rgba(255,255,255,0.12)"/>
    <line x1="0" y1="0" x2="142" y2="-46" stroke="rgba(255,255,255,0.12)"/>
    <line x1="0" y1="0" x2="88" y2="121" stroke="rgba(255,255,255,0.12)"/>
    <line x1="0" y1="0" x2="-88" y2="121" stroke="rgba(255,255,255,0.12)"/>
    <line x1="0" y1="0" x2="-142" y2="-46" stroke="rgba(255,255,255,0.12)"/>

    <!-- User Skill Match Polygon (Filled) -->
    <polygon points="0,-130 120,-38 65,95 -75,85 -115,-38" fill="url(#purpleGrad)" opacity="0.45" stroke="#a855f7" stroke-width="2.5"/>
    <circle cx="0" cy="-130" r="5" fill="#a855f7"/>
    <circle cx="120" cy="-38" r="5" fill="#a855f7"/>
    <circle cx="65" cy="95" r="5" fill="#a855f7"/>
    <circle cx="-75" cy="85" r="5" fill="#a855f7"/>
    <circle cx="-115" cy="-38" r="5" fill="#a855f7"/>

    <!-- Labels -->
    <text x="0" y="-165" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Data Science (94%)</text>
    <text x="160" y="-40" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700">Problem Solving</text>
    <text x="100" y="145" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700">Python / ML</text>
    <text x="-100" y="145" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700">Analytics</text>
    <text x="-160" y="-40" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="end">Communication</text>
  </g>

  <!-- Right Recommendation Cards -->
  <g transform="translate(450, 75)">
    <rect x="0" y="0" width="300" height="95" rx="12" fill="#1b1d38" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="32" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="800">TOP RECOMMENDED ROLE</text>
    <text x="20" y="58" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="900">Machine Learning Engineer</text>
    <text x="20" y="80" fill="#10b981" font-family="system-ui" font-size="13" font-weight="700">96.8% Confidence Match</text>

    <rect x="0" y="115" width="300" height="95" rx="12" fill="#15172e" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="147" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="800">SECONDARY MATCH</text>
    <text x="20" y="173" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="900">Data Analytics Specialist</text>
    <text x="20" y="195" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700">92.4% Confidence Match</text>

    <rect x="0" y="230" width="300" height="95" rx="12" fill="#15172e" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="262" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="800">SKILL GAP ANALYSIS</text>
    <text x="20" y="288" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="800">Targeted Upskilling Plan</text>
    <text x="20" y="308" fill="#e2e8f0" font-family="system-ui" font-size="12">Dynamic course &amp; roadmap generator</text>
  </g>
</svg>
