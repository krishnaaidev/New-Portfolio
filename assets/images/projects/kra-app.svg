<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#132135"/>
    </linearGradient>
    <linearGradient id="kraAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#kraBg)"/>

  <!-- Top Application Window -->
  <g transform="translate(60, 45)">
    <!-- Header -->
    <rect x="0" y="0" width="680" height="50" rx="12" fill="#1b2a40" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="25" cy="25" r="6" fill="#ef4444"/>
    <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="25" r="6" fill="#10b981"/>
    <text x="95" y="30" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="700">CT Group of Institutions • KRA &amp; KPI Performance Management Portal</text>
    <rect x="545" y="12" width="120" height="26" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="605" y="29" fill="#34d399" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">ACTIVE &amp; LIVE</text>
  </g>

  <!-- Left: 1,000-Mark KPI Framework Gauge & Cards -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="320" height="340" rx="14" fill="#152438" stroke="rgba(16,185,129,0.3)"/>
    
    <text x="25" y="35" fill="#34d399" font-family="system-ui" font-size="11" font-weight="800">EVALUATION FRAMEWORK</text>
    <text x="25" y="60" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="900">1,000-Mark Scorecard</text>
    
    <!-- Big Score Circle -->
    <circle cx="160" cy="155" r="65" fill="none" stroke="#223650" stroke-width="16"/>
    <circle cx="160" cy="155" r="65" fill="none" stroke="url(#kraAccent)" stroke-width="16" stroke-dasharray="350 408" stroke-dashoffset="0"/>
    <text x="160" y="152" fill="#ffffff" font-family="system-ui" font-size="28" font-weight="900" text-anchor="middle">885</text>
    <text x="160" y="174" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">/ 1,000 MARKS</text>

    <!-- Score Breakdown Bars -->
    <g transform="translate(25, 245)">
      <text x="0" y="12" fill="#94a3b8" font-family="system-ui" font-size="11">Teaching &amp; Academics</text>
      <text x="270" y="12" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="end">460/500</text>
      <rect x="0" y="20" width="270" height="6" rx="3" fill="#223650"/>
      <rect x="0" y="20" width="248" height="6" rx="3" fill="#10b981"/>

      <text x="0" y="48" fill="#94a3b8" font-family="system-ui" font-size="11">Research &amp; Publications</text>
      <text x="270" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="end">245/300</text>
      <rect x="0" y="56" width="270" height="6" rx="3" fill="#223650"/>
      <rect x="0" y="56" width="220" height="6" rx="3" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Right: Role-Based Access Control (RBAC) & Export Feature -->
  <g transform="translate(400, 115)">
    <!-- RBAC 3-Tier Card -->
    <rect x="0" y="0" width="340" height="155" rx="14" fill="#152438" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="32" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="800">RBAC GOVERNANCE TIERS</text>
    
    <g transform="translate(25, 52)">
      <rect x="0" y="0" width="85" height="75" rx="8" fill="#1c2f4a" stroke="#38bdf8"/>
      <text x="42" y="32" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">FACULTY</text>
      <text x="42" y="52" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Self-Appraisal</text>

      <rect x="100" y="0" width="85" height="75" rx="8" fill="#1c2f4a" stroke="#60a5fa"/>
      <text x="142" y="32" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">HOD</text>
      <text x="142" y="52" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Dept Review</text>

      <rect x="200" y="0" width="85" height="75" rx="8" fill="#1c2f4a" stroke="#10b981"/>
      <text x="242" y="32" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="800" text-anchor="middle">HOI</text>
      <text x="242" y="52" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Final Approval</text>
    </g>

    <!-- Tech Stack & SheetJS XLSX Export -->
    <rect x="0" y="175" width="340" height="165" rx="14" fill="#152438" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="205" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="800">ENTERPRISE WEB ARCHITECTURE</text>
    <text x="25" y="232" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">Next.js 14 + TypeScript + Tailwind</text>
    <text x="25" y="254" fill="#94a3b8" font-family="system-ui" font-size="12">Better-SQLite3 • JWT RBAC • SheetJS Excel Export</text>

    <rect x="25" y="274" width="290" height="42" rx="8" fill="#1e3450"/>
    <text x="40" y="300" fill="#6ee7b7" font-family="system-ui" font-size="11" font-weight="700">✓ Automated Excel Audit Reports &amp; Analytics</text>
  </g>
</svg>
