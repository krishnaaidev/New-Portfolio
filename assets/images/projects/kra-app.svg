<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07121e"/>
      <stop offset="100%" stop-color="#0f2238"/>
    </linearGradient>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B"/>
      <stop offset="50%" stop-color="#0175C2"/>
      <stop offset="100%" stop-color="#54C5F8"/>
    </linearGradient>
    <linearGradient id="scoreRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#kraBg)"/>

  <!-- Flutter Smartphone Mockup (Center Left) -->
  <g transform="translate(110, 50)">
    <!-- Phone Outer Body -->
    <rect x="0" y="0" width="220" height="400" rx="30" fill="#0b1322" stroke="#0284c7" stroke-width="2.5" filter="drop-shadow(0 15px 30px rgba(2, 132, 199, 0.25))"/>
    
    <!-- Phone Notch / Camera -->
    <rect x="65" y="10" width="90" height="18" rx="9" fill="#070d18"/>
    <circle cx="85" cy="19" r="4" fill="#1e293b"/>
    <circle cx="130" cy="19" r="3" fill="#0284c7"/>

    <!-- Screen Display Area -->
    <rect x="12" y="38" width="196" height="345" rx="16" fill="#111d30"/>

    <!-- App Bar -->
    <rect x="12" y="38" width="196" height="44" rx="16" fill="#1a2d4a"/>
    <text x="30" y="65" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800">CTG Faculty App</text>
    <circle cx="185" cy="60" r="5" fill="#38bdf8"/>

    <!-- Flutter Watermark Logo -->
    <g transform="translate(145, 95) scale(0.65)">
      <path d="M25 0 L0 25 L8 33 L41 0 Z" fill="#54C5F8"/>
      <path d="M25 18 L12 31 L20 39 L41 18 Z" fill="#29B6F6"/>
      <path d="M12 31 L20 39 L41 18 L33 10 Z" fill="#0175C2"/>
    </g>

    <!-- Faculty Profile Summary Card -->
    <rect x="24" y="92" width="172" height="65" rx="8" fill="#182a44"/>
    <circle cx="48" cy="124" r="16" fill="#0284c7"/>
    <text x="48" y="129" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="900" text-anchor="middle">SK</text>
    <text x="74" y="118" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="800">Prof. S. Krishna</text>
    <text x="74" y="132" fill="#94a3b8" font-family="system-ui" font-size="8">CSE Dept • CT Group</text>
    <text x="74" y="144" fill="#34d399" font-family="system-ui" font-size="8" font-weight="700">Appraisal: Verified</text>

    <!-- 1000-Mark Scorecard Ring inside Mobile -->
    <circle cx="110" cy="225" r="45" fill="none" stroke="#1e3450" stroke-width="10"/>
    <circle cx="110" cy="225" r="45" fill="none" stroke="url(#scoreRing)" stroke-width="10" stroke-dasharray="240 283" stroke-dashoffset="0"/>
    <text x="110" y="222" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="900" text-anchor="middle">885</text>
    <text x="110" y="238" fill="#94a3b8" font-family="system-ui" font-size="8" font-weight="700" text-anchor="middle">/ 1,000 MARKS</text>

    <!-- Action Buttons -->
    <rect x="26" y="295" width="78" height="26" rx="6" fill="#0284c7"/>
    <text x="65" y="312" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="800" text-anchor="middle">KRA Stats</text>

    <rect x="114" y="295" width="78" height="26" rx="6" fill="#10b981"/>
    <text x="153" y="312" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="800" text-anchor="middle">Export XLSX</text>

    <!-- Bottom Navigation Bar -->
    <rect x="12" y="345" width="196" height="38" rx="10" fill="#162740"/>
    <circle cx="45" cy="364" r="4" fill="#38bdf8"/>
    <circle cx="110" cy="364" r="4" fill="#94a3b8"/>
    <circle cx="175" cy="364" r="4" fill="#94a3b8"/>
  </g>

  <!-- Right Side: Architecture & Features -->
  <g transform="translate(390, 60)">
    <!-- Badge -->
    <rect x="0" y="0" width="350" height="95" rx="14" fill="#132338" stroke="url(#flutterGrad)" stroke-width="1.5"/>
    <text x="25" y="32" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="800">BUILT WITH FLUTTER &amp; DART</text>
    <text x="25" y="58" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="900">CTG Faculty App</text>
    <text x="25" y="80" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700">Cross-Platform Mobile &amp; Web Platform</text>

    <!-- RBAC 3-Tier Hierarchy Card -->
    <rect x="0" y="115" width="350" height="145" rx="14" fill="#132338" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="145" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="800">3-TIER GOVERNANCE WORKFLOW</text>
    
    <g transform="translate(25, 162)">
      <rect x="0" y="0" width="90" height="70" rx="8" fill="#1a304d" stroke="#38bdf8"/>
      <text x="45" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">FACULTY</text>
      <text x="45" y="48" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Self-Appraisal</text>

      <rect x="105" y="0" width="90" height="70" rx="8" fill="#1a304d" stroke="#60a5fa"/>
      <text x="150" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">HOD</text>
      <text x="150" y="48" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Dept Review</text>

      <rect x="210" y="0" width="90" height="70" rx="8" fill="#1a304d" stroke="#10b981"/>
      <text x="255" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800" text-anchor="middle">HOI</text>
      <text x="255" y="48" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Final Approval</text>
    </g>

    <!-- Key Capabilities -->
    <rect x="0" y="280" width="350" height="95" rx="14" fill="#132338" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="308" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="800">1,000-MARK FRAMEWORK ENGINE</text>
    <text x="25" y="332" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="800">Real-Time Scoring &amp; Excel/PDF Export</text>
    <text x="25" y="354" fill="#94a3b8" font-family="system-ui" font-size="11">Automated institutional accreditation audit generation</text>
  </g>
</svg>
