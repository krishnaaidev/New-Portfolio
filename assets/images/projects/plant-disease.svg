<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="plantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0)"/>
      <stop offset="50%" stop-color="rgba(52, 211, 153, 0.4)"/>
      <stop offset="100%" stop-color="rgba(52, 211, 153, 0)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#plantBg)"/>

  <!-- Scanning Leaf Graphic -->
  <g transform="translate(100, 70)">
    <!-- Bounding Box -->
    <rect x="0" y="0" width="280" height="340" rx="16" fill="#0d241b" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- Corner brackets -->
    <path d="M-5 30 V-5 H30 M250 -5 H285 V30 M-5 310 V345 H30 M250 345 H285 V310" stroke="#34d399" stroke-width="4" fill="none"/>
    
    <!-- Stylized Leaf -->
    <path d="M140 40 C70 120 60 230 140 290 C220 230 210 120 140 40 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M140 40 L140 290 M140 100 Q180 120 190 140 M140 160 Q190 180 195 200 M140 100 Q100 120 90 140 M140 160 Q90 180 85 200" stroke="#a7f3d0" stroke-width="3" fill="none"/>
    
    <!-- Disease Target Circle -->
    <circle cx="170" cy="180" r="28" fill="#ef4444" opacity="0.3"/>
    <circle cx="170" cy="180" r="28" fill="none" stroke="#f87171" stroke-width="2"/>
    <line x1="170" y1="145" x2="170" y2="215" stroke="#f87171" stroke-width="1.5"/>
    <line x1="135" y1="180" x2="205" y2="180" stroke="#f87171" stroke-width="1.5"/>

    <!-- Scanning Line -->
    <rect x="10" y="160" width="260" height="40" fill="url(#scanBeam)"/>
    <line x1="10" y1="180" x2="270" y2="180" stroke="#6ee7b7" stroke-width="2"/>
  </g>

  <!-- CNN Architecture Breakdown -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="310" height="320" rx="16" fill="#0d241b" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="40" fill="#6ee7b7" font-family="system-ui" font-size="12" font-weight="800">DEEP LEARNING PIPELINE</text>
    <text x="25" y="68" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="900">Custom CNN Model</text>
    <text x="25" y="92" fill="#94a3b8" font-family="system-ui" font-size="13">PlantVillage Dataset (38 Classes)</text>

    <!-- Metrics -->
    <rect x="25" y="120" width="125" height="70" rx="8" fill="#14382a"/>
    <text x="40" y="145" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="700">TEST ACCURACY</text>
    <text x="40" y="175" fill="#34d399" font-family="system-ui" font-size="24" font-weight="900">96.7%</text>

    <rect x="165" y="120" width="120" height="70" rx="8" fill="#14382a"/>
    <text x="180" y="145" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="700">INFERENCE</text>
    <text x="180" y="175" fill="#38bdf8" font-family="system-ui" font-size="24" font-weight="900">&lt;120ms</text>

    <!-- Detected Condition Pill -->
    <rect x="25" y="210" width="260" height="42" rx="8" fill="#1f4e3b" stroke="#10b981"/>
    <text x="40" y="236" fill="#a7f3d0" font-family="system-ui" font-size="13" font-weight="700">Status: Early Blight Detected (97.4%)</text>

    <!-- Deployment Badge -->
    <text x="25" y="285" fill="#94a3b8" font-family="system-ui" font-size="12">Deployed on: <tspan fill="#ffffff" font-weight="700">Flask + TensorFlow + OpenCV</tspan></text>
  </g>
</svg>
