<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e67615"/>
      <stop offset="100%" stop-color="#eab30815"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#00e67608" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="140" width="4" height="350" fill="url(#green)" rx="2"/>

  <!-- SK Badge -->
  <rect x="100" y="155" width="200" height="200" rx="28" fill="url(#badge)" stroke="#00e676" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="200" y="296" font-family="'JetBrains Mono', monospace" font-size="100" font-weight="800" text-anchor="middle" fill="url(#green)">SK</text>

  <!-- Name -->
  <text x="345" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="62" font-weight="800" fill="#e8e8e8">Suman Krishna</text>

  <!-- Role -->
  <text x="345" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="600" fill="#00e676">Machine Learning &amp; Data Science Engineer</text>

  <!-- Divider -->
  <rect x="345" y="328" width="760" height="2" fill="url(#green)" opacity="0.3" rx="1"/>

  <!-- Tags row -->
  <text x="345" y="380" font-family="'JetBrains Mono', monospace" font-size="22" fill="#8a9a8a">
    Python  ·  Flutter  ·  LLMs  ·  RAG  ·  Deep Learning  ·  Power BI
  </text>

  <!-- Badges -->
  <rect x="345" y="420" width="220" height="44" rx="8" fill="#00e67615" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="455" y="448" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#00e676">NASSCOM Gold ×7</text>

  <rect x="582" y="420" width="210" height="44" rx="8" fill="#eab30815" stroke="#eab308" stroke-width="1" stroke-opacity="0.5"/>
  <text x="687" y="448" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#eab308">12 Projects</text>

  <rect x="809" y="420" width="260" height="44" rx="8" fill="#00e67615" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="939" y="448" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#00e676">Google Student Amb.</text>

  <!-- URL -->
  <text x="345" y="545" font-family="'JetBrains Mono', monospace" font-size="22" fill="#4a5a4a">sumankrishnaportfolio.netlify.app</text>

  <!-- Bottom green line -->
  <rect x="80" y="610" width="1040" height="3" fill="url(#green)" rx="2" opacity="0.6"/>
</svg>
