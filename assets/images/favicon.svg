<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Background square with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#080808"/>
  <!-- Green border -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#skGrad)" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- S letter -->
  <text x="50" y="68" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="58" font-weight="800" text-anchor="middle"
        fill="url(#skGrad)">S</text>
</svg>
